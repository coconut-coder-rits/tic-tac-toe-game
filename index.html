<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Tic Tac Toe</h1>
        <h2 id="status">Player X's Turn</h2>

        <div class="board-wrapper">
            <div class="board">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <!-- Strike Line -->
            <svg class="strike-svg" viewBox="0 0 300 300">
                <line id="strike-line"></line>
            </svg>
        </div>

        <button id="restart">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
